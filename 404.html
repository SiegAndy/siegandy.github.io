<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <script>
        const target = "https://chang-zeng.github.io" + window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(target);
    </script>
    <meta http-equiv="refresh" content="0; url=https://chang-zeng.github.io/">
</head>

<body>
    <p>
        This site has moved to
        <a href="https://chang-zeng.github.io/">https://chang-zeng.github.io/</a>.
    </p>
</body>

</html>
